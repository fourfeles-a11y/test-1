<!DOCTYPE html>
<html>
<head>
    <title>Level 2 - Hidden Password</title>

    <style>
        body {
            background: #050505;
            color: #00ff88;
            font-family: monospace;
            text-align: center;
            padding-top: 50px;
        }

        .computer {
            border: 2px solid #00ff88;
            width: 600px;
            margin: auto;
            padding: 30px;
            text-align: left;
        }

        input {
            background: black;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 12px;
            width: 250px;
            font-family: monospace;
        }

        button {
            padding: 12px 20px;
            background: #00ff88;
            border: none;
            cursor: pointer;
        }

        .tiny {
            color: #111;
            font-size: 5px;
        }

        #next {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="computer">

<h1>SECURITY TERMINAL</h1>

<p>> SECURITY SYSTEM ONLINE</p>
<p>> ACCESS CODE REQUIRED</p>
<p>> Hint: The answer is somewhere on this screen.</p>

<p>System ID: <b>7391</b></p>

<input id="password" placeholder="Enter access code">

<button onclick="check()">SUBMIT</button>

<p id="message"></p>

<button id="next" onclick="location.href='STAGE 7.html'">
    NEXT LEVEL →
</button>

</div>

<p class="tiny">Nothing suspicious here...</p>

<script>

function check() {

    let answer = document.getElementById("password").value;

    if (answer === "7391") {

        document.getElementById("message").innerHTML =
            "✓ ACCESS GRANTED";

        document.getElementById("next").style.display =
            "inline-block";

    } else {

        document.getElementById("message").innerHTML =
            "✗ ACCESS DENIED";

    }
}

</script>

</body>
</html>
